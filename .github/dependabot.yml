version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /contrib/scripts/bootstrap-via-installer
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /contrib/scripts/bootstrap-without-installed-agent
    schedule:
      interval: daily
